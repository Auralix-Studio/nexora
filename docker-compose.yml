# Verificación local de la pila real: Tomcat 11 en modo producción + SQL Server 2022.
# Uso:  cp .env.example .env   (y ajusta la clave)   ->   docker compose up -d --build
# La aplicación queda en http://localhost:8080. Para borrar todo:  docker compose down
# Los datos del SQL Server local NO persisten: cada "docker compose up" parte de los datos semilla.
# Solo para pruebas locales: en Azure la aplicación usa el usuario nexora_app, no sa (ver docs/DESPLIEGUE.md).
name: nexora

services:
  # Motor de base de datos (intercalación igual a la de Azure SQL: Modern_Spanish_CI_AS).
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copia .env.example a .env y define MSSQL_SA_PASSWORD}
      MSSQL_COLLATION: Modern_Spanish_CI_AS
    ports:
      - "127.0.0.1:${SQL_PUERTO:-14330}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # Tarea de un solo uso: crea BD_NEXORA con sql/bd_nexora.sql y termina.
  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Copia .env.example a .env y define MSSQL_SA_PASSWORD}
    volumes:
      - ./sql/bd_nexora.sql:/sql/bd_nexora.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          /opt/mssql-tools18/bin/sqlcmd -C -S sql -U sa -Q "SELECT 1" > /dev/null 2>&1 && break
          echo "Esperando a SQL Server ($$i/30)..."
          sleep 2
        done
        echo "Ejecutando sql/bd_nexora.sql..."
        /opt/mssql-tools18/bin/sqlcmd -C -S sql -U sa -b -I -f 65001 -i /sql/bd_nexora.sql
        echo "BD_NEXORA lista."

  # La tienda NEXORA (Tomcat 11), construida con el Dockerfile del proyecto.
  app:
    build:
      context: .
      args:
        NEXORA_VERSION: local
      # Solo en local por http://localhost: en Azure la petición llega por HTTPS y la cookie es Secure
      NEXORA_COOKIE_SEGURA: "false"
        OMITIR_PRUEBAS: ${OMITIR_PRUEBAS:-false}
    image: nexora:local
    depends_on:
      sql-init:
        condition: service_completed_successfully
    environment:
      NEXORA_ENTORNO: produccion
      NEXORA_DEMO: "true"
      NEXORA_VERSION: local
      DB_URL: jdbc:sqlserver://sql:1433;databaseName=BD_NEXORA;encrypt=true;trustServerCertificate=true;loginTimeout=30;
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Copia .env.example a .env y define MSSQL_SA_PASSWORD}
    ports:
      - "8080:8080"
    healthcheck:
      # La imagen no garantiza curl: se usa bash con /dev/tcp y se espera un "200" en la línea de estado.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /salud HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
