# Integración y entrega continua de NEXORA:
#   pruebas   -> compila y ejecuta las pruebas JUnit
#   imagen    -> construye la imagen, la prueba de punta a punta en un contenedor y, en main, la publica en GHCR
#   desplegar -> en main y solo si existe la variable de repositorio AZURE_CLIENT_ID, actualiza el Container App
# Guía de configuración: docs/DESPLIEGUE.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# En pull requests se cancela la ejecución anterior; en main nunca (podría interrumpir un despliegue).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar las pruebas
        run: mvn -B verify

      - name: Guardar los informes de las pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-surefire
          path: target/surefire-reports
          if-no-files-found: ignore

  imagen:
    name: Imagen y pruebas E2E
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      etiqueta: ${{ steps.meta.outputs.sha }}
      imagen: ${{ steps.meta.outputs.imagen }}
    steps:
      - uses: actions/checkout@v4

      - name: Calcular nombre y etiqueta de la imagen
        id: meta
        run: |
          propietario="${GITHUB_REPOSITORY_OWNER,,}"
          echo "imagen=ghcr.io/${propietario}/nexora" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Las pruebas JUnit ya corrieron en el job anterior: aquí se omiten para no repetirlas dentro de la imagen.
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.imagen }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.imagen }}:latest
          build-args: |
            NEXORA_VERSION=${{ steps.meta.outputs.sha }}
            OMITIR_PRUEBAS=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Modo desarrollo: sin base de datos (DB_URL apunta a un puerto cerrado) la aplicación usa su respaldo en memoria.
      - name: Arrancar el contenedor
        env:
          IMAGEN: ${{ steps.meta.outputs.imagen }}
          ETIQUETA: ${{ steps.meta.outputs.sha }}
        run: |
          docker run -d --name nexora-e2e -p 8080:8080 \
            -e NEXORA_ENTORNO=desarrollo \
            -e "DB_URL=jdbc:sqlserver://localhost:1;loginTimeout=1" \
            "${IMAGEN}:${ETIQUETA}"
          bash infra/esperar-salud.sh http://localhost:8080 240

      - name: Prueba de punta a punta de la tienda
        run: |
          set -o pipefail
          bash docs/pruebas/e2e.sh http://localhost:8080 | tee "$RUNNER_TEMP/e2e.log"
          grep -Eq -- '^---- [0-9]+ OK, 0 FAIL$' "$RUNNER_TEMP/e2e.log"

      # e2e-admin.sh supone datos semilla recién cargados: se reinicia el contenedor (el respaldo en memoria vuelve a la semilla).
      - name: Reiniciar el contenedor con datos semilla
        run: |
          docker restart nexora-e2e
          bash infra/esperar-salud.sh http://localhost:8080 240

      - name: Prueba de punta a punta del módulo de administración
        run: |
          set -o pipefail
          bash docs/pruebas/e2e-admin.sh http://localhost:8080 | tee "$RUNNER_TEMP/e2e-admin.log"
          grep -Eq -- '^---- [0-9]+ OK, 0 FAIL$' "$RUNNER_TEMP/e2e-admin.log"

      - name: Registros del contenedor (si algo falló)
        if: failure()
        run: docker logs nexora-e2e 2>&1 | tail -n 200

      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar en GHCR (etiqueta sha corto y latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGEN: ${{ steps.meta.outputs.imagen }}
        run: docker push --all-tags "$IMAGEN"

  desplegar:
    name: Desplegar en Azure Container Apps
    needs: imagen
    # Solo en main y solo si el repositorio tiene la variable AZURE_CLIENT_ID (ver docs/DESPLIEGUE.md, OIDC).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    env:
      GRUPO: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-nexora' }}
      APP: ${{ vars.AZURE_CONTAINERAPP_NAME || 'ca-nexora' }}
      IMAGEN: ${{ needs.imagen.outputs.imagen }}
      ETIQUETA: ${{ needs.imagen.outputs.etiqueta }}
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en Azure (OIDC, sin secretos)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar la imagen del Container App
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          puerto="$(az containerapp show -g "$GRUPO" -n "$APP" --query properties.configuration.ingress.targetPort -o tsv)"
          if [ "$puerto" != "8080" ]; then
            echo "::error::El Container App aún usa la configuración de arranque (puerto $puerto). Ejecuta una vez 'bash infra/desplegar.sh' desde tu equipo (ver docs/DESPLIEGUE.md)."
            exit 1
          fi
          az containerapp update -g "$GRUPO" -n "$APP" \
            --image "${IMAGEN}:${ETIQUETA}" \
            --set-env-vars "NEXORA_VERSION=${ETIQUETA}" \
            --only-show-errors -o none

      - name: Esperar a que /salud responda con la versión nueva
        run: |
          fqdn="$(az containerapp show -g "$GRUPO" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)"
          bash infra/esperar-salud.sh "https://${fqdn}" 420 "$ETIQUETA"
